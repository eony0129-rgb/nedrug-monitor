name: nedrug monitor

on:
  schedule:
    - cron: "7 * * * *"       # 매시 7분경 (GitHub 사정으로 지연될 수 있음)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nedrug-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TARGET_URL:  https://nedrug.mfds.go.kr/pbp/CCBAE01
          KEYWORDS:    ${{ vars.KEYWORDS }}
          MATCH_FIELD: ${{ vars.MATCH_FIELD }}
          NOTIFY_ON_FIRST_RUN: ${{ vars.NOTIFY_ON_FIRST_RUN }}
          ALERT_ON_CANCEL: ${{ vars.ALERT_ON_CANCEL }}
          ALIVE_MAIL_DAYS: ${{ vars.ALIVE_MAIL_DAYS }}
          HEARTBEAT_DAYS:  ${{ vars.HEARTBEAT_DAYS }}
          SMTP_HOST:   ${{ vars.SMTP_HOST }}
          SMTP_PORT:   ${{ vars.SMTP_PORT }}
          SMTP_USER:   ${{ secrets.SMTP_USER }}
          SMTP_PASS:   ${{ secrets.SMTP_PASS }}
          MAIL_TO:     ${{ secrets.MAIL_TO }}
          TG_TOKEN:    ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:  ${{ secrets.TG_CHAT_ID }}
        run: python monitor.py

      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json || exit 0
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: update seen state [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
